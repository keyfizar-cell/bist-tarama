-          git push
+          if git diff --staged --quiet; then
+            echo "veri degismedi, commit yok"; exit 0
+          fi
+          git commit -m "tarama: $(date -u +%Y-%m-%d)"
+          # Guvenli push: carpismada rebase edip 5 kez dener (concurrency ile
+          # birlikte es zamanli kosulara karsi ana isi cokertmez).
+          for i in 1 2 3 4 5; do
+            if git push; then echo "push OK (deneme $i)"; exit 0; fi
+            echo "push carpisti; rebase edip yeniden deniyorum ($i)"
+            git pull --rebase --autostash || true
+            sleep $((i * 3))
+          done
+          echo "push 5 denemede basarisiz"; exit 1
+
       - name: Durum dosyası yaz
         if: always()
         run: |
