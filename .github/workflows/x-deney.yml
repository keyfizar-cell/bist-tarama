name: X Ucretsiz Yol Deneyi

# v1.0 (2026-11-15): araclar/x_deney.py — hesapsiz/ucretsiz X ve benzeri herkese acik uclari yoklar.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deney:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python araclar/x_deney.py
      - name: JSON'u commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/x_deney.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "x deney sonucu [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main || true; git push origin HEAD:main && exit 0; sleep $((i * 3)); done
          echo "push 5 denemede basarisiz"; exit 1
