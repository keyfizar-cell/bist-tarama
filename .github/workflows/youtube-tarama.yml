name: YouTube Emir Bozkurt Takip

# v2.3 (2026-11-07): Emir Bozkurt (youtube_tarama.py) + konuk uzman takibi (youtube_konuk.py, konuk_takip.json)
#   + ek kanal takibi (youtube_kanallar.py, kanal_takip.json).
# Secret: GOOGLE_API_KEY (opsiyonel YOUTUBE_API_KEY, GEMINI_MODEL).
on:
  workflow_run:
    workflows: ["BIST Emir Bozkurt Taraması"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-emir
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Taramayi calistir
        run: python youtube_tarama.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      - name: Konuk uzman taramasi
        run: python youtube_konuk.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      - name: Ek kanal taramasi
        run: python youtube_kanallar.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      - name: JSON'u commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube_emir.json data/youtube_konuk.json data/youtube_kanallar.json || true
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "youtube verisi guncelle [skip ci]" || true
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then echo "Push basarili."; break; fi
            sleep 5
          done
