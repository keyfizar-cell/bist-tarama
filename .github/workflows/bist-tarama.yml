name: BIST Emir Bozkurt Taraması

# ZAMANLAMA: GitHub'in ucretsiz "schedule" cron'u 26.08.2026'dan beri saatlerce
# geciyor / bazen dusuyor. Bu yuzden schedule KALDIRILDI; is artik yalnizca
# harici bir zamanlayicidan (cron-job.org) workflow_dispatch ile tetiklenir.
# Not: schedule olmadigi icin "60 gun aktivite" otomatik devre disi kurali da
# gecersizdir; ama harici tetigin AYAKTA kalmasi sart (rehber: KURULUM.md).
on:
  workflow_dispatch:

# Cift-kosu korumasi: harici tetik + elle tetik (veya tekrar deneme) ayni anda
# gelse bile is tek seferde calisir; devam eden kosu bitene kadar yeni kosu
# kuyrukta bekler -> veri butunlugu korunur, push yarisi olusmaz.
concurrency:
  group: bist-tarama
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklari kur
        run: pip install --quiet tradingview-screener pandas yfinance isyatirimhisse

      - name: Taramayi calistir
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
        run: python tarama.py

      - name: Sonucu repoya isle
        run: |
          git config user.name  "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "veri degismedi, commit yok"; exit 0
          fi
          git commit -m "tarama: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push OK (deneme $i)"; exit 0; fi
            echo "push carpisti; rebase edip yeniden deniyorum ($i)"
            git pull --rebase --autostash || true
            sleep $((i * 3))
          done
          echo "push 5 denemede basarisiz"; exit 1

      - name: Durum dosyası yaz
        if: always()
        run: |
          mkdir -p data
          cat > data/status.json <<EOF
          {"sonuc": "${{ job.status }}", "zaman_utc": "$(date -u +%FT%TZ)", "tetik": "${{ github.event_name }}", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/status.json
          git commit -m "durum: ${{ job.status }}" || true
          git pull --rebase --autostash || true
          git push || true
