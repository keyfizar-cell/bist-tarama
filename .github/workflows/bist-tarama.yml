name: BIST Emir Bozkurt Taraması

on:
  schedule:
    - cron: '20 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklari kur
        run: pip install --quiet tradingview-screener pandas yfinance

      - name: Taramayi calistir
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
        run: python tarama.py

      - name: Sonucu repoya isle
        run: |
          git config user.name  "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "tarama: $(date -u +%Y-%m-%d)"
          git push
      - name: Durum dosyası yaz
        if: always()
        run: |
          mkdir -p data
          cat > data/status.json <<EOF
          {"sonuc": "${{ job.status }}", "zaman_utc": "$(date -u +%FT%TZ)", "tetik": "${{ github.event_name }}", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/status.json
          git commit -m "durum: ${{ job.status }}" || true
          git pull --rebase --autostash || true
          git push || true
