name: Testler

# Python betikleri veya testler değişince birim testlerini çalıştırır.
on:
  push:
    paths: ["*.py", "testler/**", ".github/workflows/testler.yml"]
  pull_request:
    paths: ["*.py", "testler/**", ".github/workflows/testler.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Birim testleri
        run: python -m unittest discover -s testler -v
