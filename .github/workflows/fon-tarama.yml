name: BIST Fon Taraması

# TEFAS fon verisi (data/fon.json) üretir. Ana taramadan BAĞIMSIZ; ana tarama
# bittikten sonra otomatik, ayrıca elle (workflow_dispatch) tetiklenebilir.
# Ana tarama iş akışının adını kap-tarama.yml ile AYNI tut:
#   "BIST Emir Bozkurt Taraması"  (farklıysa aşağıdaki workflows[] değerini düzelt)

on:
  workflow_run:
    workflows: ["BIST Emir Bozkurt Taraması"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-tarama
  cancel-in-progress: false

jobs:
  fon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          # tefasmak curl_cffi'yi bağımlılık olarak çeker (Akamai TLS bypass)
          pip install "tefasmak==1.0.1"
          # yedek ayrıştırıcı (opsiyonel; yoksa script tefasmak'a düşer)
          pip install "pytefas==0.4.1" || echo "pytefas kurulamadı, yalnız tefasmak"

      - name: Fon taraması
        run: python3 fon_tarama.py   # her durumda exit 0, data/fon.json yazar

      - name: fon.json'u commit et
        run: |
          git config user.name "bist-fon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fon.json
          if git diff --cached --quiet; then
            echo "değişiklik yok"
          else
            git commit -m "fon.json güncellendi ($(date -u +%FT%TZ))"
            # eşzamanlı push'a karşı güvenli rebase'li deneme
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              if git push origin HEAD:"${GITHUB_REF_NAME:-main}"; then
                echo "push başarılı"; break
              fi
              echo "push denemesi $i başarısız, tekrar"; sleep 5
            done
          fi
